name: Feature Request
description: Suggest a capability the package does not have yet.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        The package deliberately carries no runtime dependency, and anything an application might not need lives behind a subpath entry point. Requests that fit those constraints move fastest.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the package makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would the API look like? A code sample of how you would call it is ideal.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What did you try instead, and why was it not enough? Implementing SatimCallStore or SatimEventPublisher yourself covers many cases.
    validations:
      required: false
