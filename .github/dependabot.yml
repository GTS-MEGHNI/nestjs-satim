# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
    ignore:
      # v13 declares engines node >=22, and the test matrix covers Node 20,
      # which this package supports. A major bump here would silently stop the
      # store suite running on the oldest supported runtime.
      - dependency-name: 'better-sqlite3'
        update-types: ['version-update:semver-major']
      # TypeScript 7.0 dropped the programmatic compiler API, which NestJS
      # tooling (and this package's build/typecheck setup) still depends on.
      # Microsoft plans to restore it in 7.1, so hold at 5.x majors until then.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
      dev-tooling:
        patterns:
          - 'oxlint'
          - 'prettier'
          - 'typescript'
          - 'vitest'
          - '@vitest/*'
          - 'publint'
          - '@arethetypeswrong/*'
